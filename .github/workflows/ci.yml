name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_VL7DRX3fvOJN@ep-restless-waterfall-b3hi7n8t-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'liferpg_hyper_secret_jwt_key_hackathon_2026_gamify_reality_xyz' }}
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Type Checking
        run: npx tsc --noEmit

      - name: Run Vitest Test Suite
        run: npm run test

      - name: Build Production Application
        run: npm run build
